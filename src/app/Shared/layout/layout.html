<div class="app-container">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light shadow-sm sticky-top px-3">
    <!-- Logo and Title -->
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="logo_st josephs.png" alt="Logo" class="me-2" style="height:40px; width:auto;" />
      <span class="fs-6 fw-bold text-white">St. Joseph's Parish Management System</span>
    </a>

    <!-- Mobile toggle button -->
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
            aria-controls="navbarContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar content -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <!-- Left side: can add nav links if needed -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Example nav link -->
        <!--<li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Dashboard</a>
        </li>-->
      </ul>

      <!-- Right side: Search + Profile -->
      <div class="d-flex align-items-center">
        <!-- Search box -->
        <input type="text"
               class="form-control form-control-sm me-3"
               placeholder="Search..."
               aria-label="Search" />

        <!-- Profile dropdown -->
        <div class="dropdown">
          <button class="btn btn-light d-flex align-items-center dropdown-toggle"
                  type="button"
                  id="profileDropdown"
                  data-bs-toggle="dropdown"
                  aria-expanded="false">
            <img src="user-dummy-img.jpg" alt="Profile" class="rounded-circle me-2" style="width:32px; height:32px;">
            <span>Siju</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
            <li><a class="dropdown-item" routerLink="/profile" routerLinkActive="active">View Profile</a></li>
            <li><a class="dropdown-item" routerLink="/logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>



  <!-- Layout Body -->
  <div class="layout-body">
    <!-- Sidebar Menu -->
    <aside class="sidebar bg-light shadow-sm vh-100 d-flex flex-column p-3">
      <div class="sidebar-header mb-4 text-center">
        <h5 class="fw-bold text-primary mb-0">Portal</h5>
        <hr />
      </div>

      <ul class="nav flex-column nav-pills gap-2">
        <li class="nav-item">
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-link d-flex align-items-center">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/web/activities" routerLinkActive="active" class="nav-link d-flex align-items-center">
            <i class="bi bi-calendar-event me-2"></i> Activities
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/portal/members" routerLinkActive="active" class="nav-link d-flex align-items-center">
            <i class="bi bi-people me-2"></i> Parish Members
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/portal/birth-certificate" routerLinkActive="active" class="nav-link d-flex align-items-center">
            <i class="bi bi-file-earmark-medical me-2"></i> Birth Certificate
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/portal/death-certificate" routerLinkActive="active" class="nav-link d-flex align-items-center">
            <i class="bi bi-file-earmark-break me-2"></i> Death Certificate
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/portal/marriage-certificate" routerLinkActive="active" class="nav-link d-flex align-items-center">
            <i class="bi bi-heart me-2"></i> Marriage Certificate
          </a>
        </li>
      </ul>

      <div class="mt-auto text-center small text-muted border-top pt-3">
        © 2025 Parish System
      </div>
    </aside>



    <!-- Main Content -->
    <main class="content">
      <app-bread-crumb></app-bread-crumb>
      <router-outlet />
    </main>
  </div>
  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <span>© 2025 Parish Management System</span>
      <span class="version">v1.0.0</span>
    </div>
  </footer>
</div>
